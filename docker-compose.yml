# Services
services:

  # Backend
  backend-service:
    build:
      context: ./lora-backend/.
      dockerfile: Dockerfile
    container_name: backend-service
    restart: always
    environment:
      BROKER_URL: tcp://mqtt:1883
      SUBSCRIBE_TOPIC: lora/rx
    depends_on:
      - mqtt
    ports:
      - "8080:8080"
    networks:
      - my-network

  # Mosquitto
  mqtt:
    image: eclipse-mosquitto:2.0.18
    container_name: mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config
    networks:
      - my-network

# Volumes
volumes:
  mqtt:

# Networks
networks:
  my-network:
    driver: bridge
